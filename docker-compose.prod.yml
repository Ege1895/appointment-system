version: "3.9"

services:
  api:
    image: appointmentsystem-api:prod
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: appointmentsystem
      POSTGRES_USER: appointment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_strong_password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
